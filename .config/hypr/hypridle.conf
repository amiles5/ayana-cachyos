# Screensaver-only idle daemon. Deliberately minimal -- no general{} block
# (no lock_cmd/before_sleep_cmd/after_sleep_cmd) since Noctalia already owns
# locking and suspend (noctalia/config.toml, idle.behavior.lock, 60 min).
# This just fills the earlier idle window with a terminal screensaver before
# that longer timeout fires.

listener {
    timeout = 300                                          # 5 min
    on-timeout = $HOME/.config/hypr/scripts/screensaver.sh start
    on-resume = $HOME/.config/hypr/scripts/screensaver.sh stop
}
