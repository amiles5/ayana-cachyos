# Default espanso config. See https://espanso.org/docs/configuration/basics/
# for available options - left minimal, using built-in defaults for everything
# not explicitly set here.

# Espanso can't auto-detect the keyboard layout on Wayland (logged: "unable to
# determine keyboard layout automatically"), so it defaulted to US - on a US
# layout the '@' key is where '"' is on this GB layout, which is why "ema"
# expanded to a literal '"' instead of '@'. Matches system layout (see
# hypr/config/inputs.lua: kb_layout = "gb").
keyboard_layout:
  layout: "gb"
